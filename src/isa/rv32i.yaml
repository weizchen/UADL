          src1: "x[rs1]"
          src2: "x[rs2]"
          offset: "imm"

    - name: "BGE"
      format: "B"
      opcode: 0x63
      funct3: 0x5
      latency: 1
      behavior:
        - op: "branch_ge"
          src1: "x[rs1]"
          src2: "x[rs2]"
          offset: "imm"

    - name: "BLTU"
      format: "B"
      opcode: 0x63
      funct3: 0x6
      latency: 1
      behavior:
        - op: "branch_ltu"
          src1: "x[rs1]"
          src2: "x[rs2]"
          offset: "imm"

    - name: "BGEU"
      format: "B"
      opcode: 0x63
      funct3: 0x7
      latency: 1
      behavior:
        - op: "branch_geu"
          src1: "x[rs1]"
          src2: "x[rs2]"
          offset: "imm"

    # --- Upper Immediate ---
    - name: "LUI"
      format: "U"
      opcode: 0x37
      latency: 1
      behavior:
        - op: "lui"
          dst: "x[rd]"
          src: "imm"

    - name: "AUIPC"
      format: "U"
      opcode: 0x17
      latency: 1
      behavior:
        - op: "auipc"
          dst: "x[rd]"
          src: "imm"

    # --- Jump ---
    - name: "JAL"
      format: "J"
      opcode: 0x6F
      latency: 1
      behavior:
        - op: "jal"
          dst: "x[rd]"
          offset: "imm"

    - name: "JALR"
      format: "I"
      opcode: 0x67
      funct3: 0x0
      latency: 1
      behavior:
        - op: "jalr"
          dst: "x[rd]"
          base: "x[rs1]"
          offset: "imm"

    # --- System ---
    - name: "ECALL"
      format: "I"
      opcode: 0x73
      funct3: 0x0
      latency: 1
      behavior:
        - op: "ecall"
