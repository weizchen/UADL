      format: "IR"
      opcode: 0x13
      funct3: 0x1
      funct7: 0x00
      latency: 1
      behavior:
        - op: "sll"
          dst: "x[rd]"
          src1: "x[rs1]"
          src2: "imm"

    - name: "SRLI"
      format: "IR"
      opcode: 0x13
      funct3: 0x5
      funct7: 0x00
      latency: 1
      behavior:
        - op: "srl"
          dst: "x[rd]"
          src1: "x[rs1]"
          src2: "imm"

    - name: "SRAI"
      format: "IR"
      opcode: 0x13
      funct3: 0x5
      funct7: 0x20
      latency: 1
      behavior:
        - op: "sra"
          dst: "x[rd]"
          src1: "x[rs1]"
          src2: "imm"

    # --- Load ---
    - name: "LW"
      format: "I"
      opcode: 0x03
      funct3: 0x2
      latency: 5
      mem_access: true
      behavior:
        - op: "load_word"
          dst: "x[rd]"
          base: "x[rs1]"
          offset: "imm"

    # --- Store ---
    - name: "SW"
      format: "S"
      opcode: 0x23
      funct3: 0x2
      latency: 5
      mem_access: true
      behavior:
        - op: "store_word"
          src: "x[rs2]"
          base: "x[rs1]"
          offset: "imm"

    # --- Branch ---
    - name: "BEQ"
      format: "B"
      opcode: 0x63
      funct3: 0x0
