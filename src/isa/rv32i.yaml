isa:
  name: "RV32I"
  encoding: "riscv32"
  word_size: 32
  registers:
    - name: "x"
      count: 32
      width: 32
      signed: true
      zero_reg: 0
    - name: "PC"
      width: 32

  instructions:

    # --- R-type Arithmetic ---
    - name: "ADD"
      format: "R"
      opcode: 0x33
      funct3: 0x0
      funct7: 0x00
      latency: 1
      behavior:
        - op: "add"
          dst: "x[rd]"
          src1: "x[rs1]"
          src2: "x[rs2]"

    - name: "SUB"
      format: "R"
      opcode: 0x33
      funct3: 0x0
      funct7: 0x20
      latency: 1
      behavior:
        - op: "sub"
          dst: "x[rd]"
          src1: "x[rs1]"
          src2: "x[rs2]"

    - name: "AND"
      format: "R"
      opcode: 0x33
      funct3: 0x7
      funct7: 0x00
      latency: 1
      behavior:
        - op: "and_op"
          dst: "x[rd]"
          src1: "x[rs1]"
          src2: "x[rs2]"

    - name: "OR"
      format: "R"
      opcode: 0x33
      funct3: 0x6
      funct7: 0x00
      latency: 1
      behavior:
        - op: "or_op"
          dst: "x[rd]"
          src1: "x[rs1]"
          src2: "x[rs2]"

    - name: "XOR"
