      funct3: 0x4
      funct7: 0x00
      latency: 1
      behavior:
        - op: "xor_op"
          dst: "x[rd]"
          src1: "x[rs1]"
          src2: "x[rs2]"

    - name: "SLT"
      format: "R"
      opcode: 0x33
      funct3: 0x2
      funct7: 0x00
      latency: 1
      behavior:
        - op: "slt"
          dst: "x[rd]"
          src1: "x[rs1]"
          src2: "x[rs2]"

    - name: "SLTU"
      format: "R"
      opcode: 0x33
      funct3: 0x3
      funct7: 0x00
      latency: 1
      behavior:
        - op: "sltu"
          dst: "x[rd]"
          src1: "x[rs1]"
          src2: "x[rs2]"

    - name: "SLL"
      format: "R"
      opcode: 0x33
      funct3: 0x1
      funct7: 0x00
      latency: 1
      behavior:
        - op: "sll"
          dst: "x[rd]"
          src1: "x[rs1]"
          src2: "x[rs2]"

    - name: "SRL"
      format: "R"
      opcode: 0x33
      funct3: 0x5
      funct7: 0x00
      latency: 1
      behavior:
        - op: "srl"
          dst: "x[rd]"
          src1: "x[rs1]"
          src2: "x[rs2]"

    - name: "SRA"
      format: "R"
      opcode: 0x33
      funct3: 0x5
      funct7: 0x20
      latency: 1
      behavior:
        - op: "sra"
          dst: "x[rd]"
          src1: "x[rs1]"
          src2: "x[rs2]"

    # --- I-type Arithmetic ---
    - name: "ADDI"
      format: "I"
      opcode: 0x13
      funct3: 0x0
      latency: 1
      behavior:
        - op: "add"
          dst: "x[rd]"
          src1: "x[rs1]"
          src2: "imm"

    - name: "ANDI"
      format: "I"
      opcode: 0x13
      funct3: 0x7
      latency: 1
      behavior:
        - op: "and_op"
          dst: "x[rd]"
          src1: "x[rs1]"
          src2: "imm"

    - name: "ORI"
      format: "I"
      opcode: 0x13
      funct3: 0x6
      latency: 1
      behavior:
        - op: "or_op"
          dst: "x[rd]"
          src1: "x[rs1]"
          src2: "imm"

    - name: "XORI"
      format: "I"
      opcode: 0x13
      funct3: 0x4
      latency: 1
      behavior:
        - op: "xor_op"
          dst: "x[rd]"
          src1: "x[rs1]"
          src2: "imm"

    - name: "SLTI"
      format: "I"
      opcode: 0x13
      funct3: 0x2
      latency: 1
      behavior:
        - op: "slt"
          dst: "x[rd]"
          src1: "x[rs1]"
          src2: "imm"

    - name: "SLTIU"
      format: "I"
      opcode: 0x13
      funct3: 0x3
      latency: 1
      behavior:
